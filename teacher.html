<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>延和音樂冒險島｜教師即時監控</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f5fc;color:#263750;font:16px system-ui,-apple-system,'Noto Sans TC',sans-serif}main{max-width:1150px;padding:24px 16px 65px;margin:auto}h1{margin:0}.head{background:#172a50;color:white;padding:22px;border-radius:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#6d7b90}.btn{border:0;border-radius:11px;background:#3263a5;color:white;padding:11px 17px;font:inherit;font-weight:700;cursor:pointer}a{color:inherit}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.card{background:white;padding:18px;border-radius:15px;box-shadow:0 2px 8px #dce5f1}.big{font-size:31px;font-weight:900;color:#23669b}.section{background:white;padding:18px;border-radius:15px;margin:15px 0;overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #e3eaf3;padding:11px 8px;text-align:left;white-space:nowrap}th{background:#f0f5fb}select{padding:9px;border-radius:9px;border:1px solid #cbd6e6}#msg{margin:18px 0;background:#fff9dd;padding:12px;border-radius:12px}.mini{font-size:13px}.pill{display:inline-block;border-radius:30px;padding:4px 9px;background:#e0eef8;font-weight:700}@media(max-width:720px){.cards{grid-template-columns:repeat(2,1fr)}.head h1{font-size:22px}}
</style></head><body><main><div class="head"><div><small>延和國中｜聲音的魔法</small><h1>📊 教師即時學習監控</h1><small>僅教師Google帳號有權查看學生闖關紀錄</small></div><div><button class="btn" id="login">Google教師登入</button> <a href="index.html">回學生畫面</a></div></div><div id="msg" role="status">載入中…</div><div id="dashboard" hidden><div class="cards"><div class="card">學生數<div class="big" id="n">0</div></div><div class="card">完成第一關<div class="big" id="l1">0</div></div><div class="card">完成小組任務<div class="big" id="l3">0</div></div><div class="card">完成離場券<div class="big" id="l4">0</div></div></div><section class="section"><h2>📈 各關即時完成情況</h2><div id="stats"></div></section><section class="section"><h2>🎵 概念題與離場券</h2><div id="learning"></div><p class="mini muted">知識題紀錄完成題數及答錯重試次數；離場券統計首次作答結果，不會因重試自動洗成滿分。</p></section><section class="section"><h2>🏰 小組配樂提案</h2><div id="groups"></div></section><section class="section"><h2>👥 個別學生即時進度</h2><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><label>篩選組別 <select id="filter"><option value="all">全部</option><option value="1">第1組</option><option value="2">第2組</option><option value="3">第3組</option><option value="4">第4組</option><option value="5">第5組</option><option value="6">第6組</option><option value="7">第7組</option><option value="8">第8組</option></select></label><span class="mini muted">使用代號，不收集學生真實姓名</span></div><table><thead><tr><th>代號</th><th>組別</th><th>闖關</th><th>🪙 音符</th><th>知識題</th><th>重試</th><th>配樂</th><th>離場券</th><th>同步狀態</th></tr></thead><tbody id="studentRows"></tbody></table></section></div></main><script type="module" src="teacher.js"></script></body></html>
