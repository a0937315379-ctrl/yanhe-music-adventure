d #5b9fc4;border-radius:9px;padding:10px 12px;margin:10px 0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.choice{min-height:63px;background:white;border:3px solid #d3e3eb;border-radius:13px;font-weight:850;padding:10px;color:var(--ink)}.choice.picked{background:#fff0bd;border-color:#e9ac2c}.choice.wrong{background:#ffe5e5;border-color:#d86a6a}.flex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.meter{height:12px;border-radius:20px;background:#dce9e9;overflow:hidden;margin:10px 0}.meter>div{height:100%;background:linear-gradient(90deg,#ffb74d,#ffe273);transition:width .3s}.starburst{text-align:center;font-size:44px;animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.3);opacity:.4}to{transform:scale(1);opacity:1}}.feedback{padding:12px;border-radius:10px;background:#fff1ce;margin:10px 0;font-weight:750}.quest-card{border:2px solid #d6e4e7;background:white;border-radius:15px;padding:14px;margin:14px 0}.tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.tag{border:2px solid #bdd3e1;background:white;border-radius:20px;padding:9px 14px;font-weight:760;color:#1e4666}.tag.on{background:#ffde85;border-color:#daa23a}.proposal{background:#edfff0;border:2px dashed #7caf88;border-radius:14px;padding:14px;margin:10px 0}.status{font-size:13px;color:#315d77;padding:10px 0}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center}.hidden{display:none!important}@media(max-width:750px){.islands{grid-template-columns:repeat(2,1fr);margin:15px 13px 20px;row-gap:28px}.scene{min-height:600px}.island{min-height:133px}.island:nth-child(2),.island:nth-child(4){transform:none}.path{margin:30px 0 50px}.choices{grid-template-columns:1fr}.panel{padding:15px}.header{flex-wrap:wrap}}

/* V4 原創 2.5D 立體音樂島：不需外部3D函式庫，適合LoiLoNote Web卡片 */
body { background:linear-gradient(180deg,#bfeeff 0%,#e5f9ff 52%,#d9f5e1 100%); }
.scene { min-height:550px; background:radial-gradient(ellipse at 50% 78%,#e5fdff55 0 30%,transparent 68%),linear-gradient(180deg,#83d3ff 0%,#c3f2ff 45%,#68c8cf 45%,#54bfc4 100%);border:5px solid #fff;box-shadow:0 8px 0 #278d9e,0 15px 22px #2c83954a; }
.scene::before {content:'';position:absolute;inset:48% -9% -20%;background: repeating-radial-gradient(ellipse at 40% 15%,#f7feff55 0 2px,transparent 3px 65px);opacity:.6;pointer-events:none}

.island::after {content:'';z-index:-1;position:absolute;inset:31px 4px 1px;background:#2e7f67;clip-path:polygon(4% 35%,50% 0%,96% 35%,85% 80%,50% 100%,15% 80%);transform:translateY(17px);opacity:.88}
.island:nth-child(2)::before {background:linear-gradient(155deg,#fff3a9,#e5b66d 65%,#aa7f51)}
.island:nth-child(2)::after {background:#8f664e}

</style></head><body><div class="app"><header class="header"><div><small>延和國中・八年級音樂</small><strong>🎮 聲音的魔法｜延和暖心音樂島</strong></div><div class="hud"><span class="pill" id="points">🪙 0 音符</span><span class="pill blue" id="stars">⭐ 0／4 島</span></div></header><div class="profile"><label>學生代號（不填姓名）<input id="nickname" maxlength="12" placeholder="例如 08號"></label><label>我的組別<select id="group"><option value="1">第1組</option><option value="2">第2組</option><option value="3">第3組</option><option value="4">第4組</option><option value="5">第5組</option><option value="6">第6組</option><option value="7">第7組</option><option value="8">第8組</option></select></label><button class="btn ghost" id="restart">↻ 重設試玩</button></div><section class="scene" id="home"><span class="cloud a">☁️</span><span class="cloud b">☁️</span><span class="cloud c">☁️</span><div class="intro"><h1>🏝️ 延和暖心音樂島</h1><p>點擊立體小島探索音樂任務，蒐集音符後開啟新島嶼！</p></div><span class="scene-decor deco-a">🌲</span><span class="scene-decor deco-b">🌳</span><span class="scene-decor deco-c">🌸</span><span class="scene-decor deco-d">🎶</span><div class="islands" id="mapButtons"></div><div class="path">🎵 ➜ 🎶 ➜ ⭐ ➜ 🏆</div><div class="avatar">🧑‍🚀</div></section><div class="welcome">👆 點選發光的島嶼開始挑戰；完成任務才能解鎖下一座島！</div><section class="panel hidden" id="panel" aria-live="polite"></section><div class="status" id="syncStatus">🎮 V4.2：LIVE 投票連接原有教師端；冒險積分與投票完成確認暫存在這台平板，尚未自動核對。</div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const initial={level:0,done:[false,false,false,false],emotion:'',answers:[],song:'',traits:[],feeling:'',groupOK:false,exit:[],tries:[0,0,0],coins:0,mini:0,explain:'',stage2Index:0,emotionReason:'',peer:'',musicConfirmed:false,voteA:false,voteB:false};let st;try{st={...initial,...JSON.parse(localStorage.getItem('yanhe-adventure-v4')||'{}')}}catch(e){st={...initial}};st.done=Array.isArray(st.done)?st.done.slice(0,4):initial.done;st.coins=Number(st.coins)||0;const save=()=>{localStorage.setItem('yanhe-adventure-v4',JSON.stringify(st));window.dispatchEvent(new CustomEvent('yanhe:save',{detail:{...st,nickname:$('nickname').value.trim(),group:$('group').value}}))};const names=['情緒森林','節奏山谷','配樂城堡','離場之島'],arts=['💗','🎼','🏰','🏆'],thresholds=[0,30,80,145];const earn=(n)=>{st.coins+=n;save()};function drawMap(){let n=st.done.filter(Boolean).length;$('points').textContent='🪙 '+st.coins+' 音符';$('stars').textContent='⭐ '+n+'／4 島';$('mapButtons').innerHTML='';names.forEach((name,i)=>{let open=i===0||(st.done[i-1]&&st.coins>=thresholds[i]);let btn=document.createElement('button');btn.className='island';btn.disabled=!open;btn.innerHTML=`<span class="art">${arts[i]}</span><strong>${name}</strong><small>${st.done[i]?'✅ 已過關':open?'✨ 點我探索':'🔒 需蒐集 '+thresholds[i]+' 音符'}</small>`;btn.onclick=()=>show(i);$('mapButtons').append(btn)})}function layout(title,desc,content){$('panel').classList.remove('hidden');$('panel').innerHTML=`<div class="bar"><h2>${title}</h2><button class="btn ghost" id="mapReturn">🗺️ 返回地圖</button></div><p>${desc}</p>${content}`;$('mapReturn').onclick=()=>{$('panel').classList.add('hidden');$('home').scrollIntoView({behavior:'smooth'})}}function show(i){st.level=i;save();drawMap();if(i===0)forest();if(i===1)valley();if(i===2)castle();if(i===3)exitIsland();$('panel').scrollIntoView({behavior:'smooth',block:'start'})}function finish(i,bonus){if(!st.done[i]){st.done[i]=true;earn(bonus)}drawMap();layout('⭐ 恭喜通關！',`你已攻下「${names[i]}」，獲得音符金幣。`, `<div class="starburst">🎉 ⭐ 🪙</div><div class="feedback">目前累積 ${st.coins} 音符！下一座島已${i===3?'全部完成':'可解鎖'}。</div><button id="nextisland" class="btn gold">${i===3?'返回冒險地圖':'🌈 前往下一座島 →'}</button>`);$('nextisland').onclick=()=>i===3?($('panel').classList.add('hidden'),$('home').scrollIntoView({behavior:'smooth'})):show(i+1)}function choices(arr,current,fn){return `<div class="choices">${arr.map((v,i)=>`<button class="choice ${current===i?'picked':''}" data-c="${i}">${v}</button>`).join('')}</div>`}function bind(fn){$('panel').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>fn(Number(b.dataset.c)))}
let preservedLiveFrame=null;function forest(){const oldFrame=$('liveVoteFrame');if(oldFrame){preservedLiveFrame=oldFrame;oldFrame.remove()}const opts=['🥰 溫暖','😰 緊張','😌 平靜','🤩 活力'];const reasons=['鋼琴音色柔和','音樂速度比較快','節奏平穩','音樂聲響很密集'];layout('💗 第一島｜情緒森林','任務：聆聽老師播放的兩種配樂，找出情緒改變的證據。',`<div class="note">🎧 <b>LIVE 即時投票</b>｜聆聽老師播放的 A、B 兩輪音樂，直接在下方投票。<br><small>每輪可修改選擇，老師會統一控制開始與結束。若下方未顯示投票區，請告訴老師。</small></div><div class="live-container"><iframe id="liveVoteFrame" title="音樂情緒 LIVE 學生即時投票" loading="eager" src="https://a0937315379-ctrl.github.io/yanhe-music-live115/?role=student&amp;room=YANHE01" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen"></iframe></div><div class="note">✅ 兩輪投票都完成後，請勾選確認（目前由學生自行確認，尚未自動核對投票紀錄）。<div class="vote-confirm"><label><input type="checkbox" id="voteA" ${st.voteA?'checked':''}> 我已完成 A 輪投票</label><label><input type="checkbox" id="voteB" ${st.voteB?'checked':''}> 我已完成 B 輪投票</label></div></div><div class="quest-card"><h3>🔮 你剛才聽到最明顯的情緒是？</h3>${choices(opts,opts.findIndex(x=>x.includes(st.emotion)))}<h3>🎶 你為什麼會有這個感受？</h3><div class="tags" id="reasonBox">${reasons.map(x=>`<button class="tag ${st.emotionReason===x?'on':''}" data-reason="${x}">${x}</button>`).join('')}</div><div class="note">SEL小任務：別人的感受可能和我不同，我可以先聽對方的理由。</div><button class="btn gold" id="claim" ${!(st.emotion&&st.emotionReason&&st.voteA&&st.voteB)?'disabled':''}>💎 取得情緒寶石（+30音符）</button></div>`);if(preservedLiveFrame){const placeholder=$('liveVoteFrame');if(placeholder)placeholder.replaceWith(preservedLiveFrame)}else preservedLiveFrame=$('liveVoteFrame');bind(v=>{st.emotion=['溫暖','緊張','平靜','活力'][v];save();forest()});$('panel').querySelectorAll('[data-reason]').forEach(b=>b.onclick=()=>{st.emotionReason=b.dataset.reason;save();forest()});['voteA','voteB'].forEach(id=>{const el=$(id);if(el)el.onchange=e=>{st[id]=e.target.checked;save();const claim=$('claim');if(claim)claim.disabled=!(st.emotion&&st.emotionReason&&st.voteA&&st.voteB)}});$('claim').onclick=()=>finish(0,30)}
const qs=[{q:'BGM在廣告中主要扮演什麼角色？',options:['襯托影片氛圍','一定要蓋過旁白','決定影片長度'],answer:0,tip:'想想換掉音樂後，即使影片畫面不變，你的感受會如何。'},{q:'同一段旋律從70 BPM變成130 BPM，哪個版本較快？',options:['70 BPM','130 BPM','一樣快'],answer:1,tip:'BPM代表一分鐘內的拍數。'},{q:'「鋼琴柔和、節奏平穩」屬於哪一類描述？',options:['音樂線索','廣告的觀看人數','影片解析度'],answer:0,tip:'想想這些是否是耳朵真的可以聽到的特徵。'}];function valley(){let i=Math.min(st.answers.length,3);if(i===3){layout('🎼 第二島｜節奏山谷','你已蒐集三枚節奏音符。',`<div class="starburst">🎵🎵🎵</div><p>三題完成！你不只認識名詞，也學會用聲音證據判斷。</p><button class="btn gold" id="win">🏅 交付節奏音符（+50音符）</button>`);$('win').onclick=()=>finish(1,50);return}let q=qs[i];layout('🎼 第二島｜節奏山谷',`任務 ${i+1}／3：破解聲音密碼。你已收集 ${i}／3 枚音符。`,`<div class="meter"><div style="width:${i/3*100}%"></div></div><div class="quest-card"><h3>🎯 ${q.q}</h3>${choices(q.options,-1)}<div id="hint" class="feedback hidden"></div></div><div class="note">👂 請先聽老師的示範音樂、和隔壁同學說出理由，再作答。回答正確後才會掉落音符金幣。</div>`);bind(v=>{if(v===q.answer){st.answers.push(v);earn(0);layout('🎉 找到音樂密碼！',`第 ${i+1} 枚音符已收集。`,`<div class="starburst">🎶 +1</div><p>這一題的音樂線索已解開。</p><button class="btn gold" id="go">前往下一個音符挑戰 ➜</button>`);$('go').onclick=valley}else{st.tries[i]=(st.tries[i]||0)+1;save();$('hint').classList.remove('hidden');$('hint').textContent='🔍 提示：'+q.tip}})}
function castle(){const songs=[['A','🎹 溫暖鋼琴'],['B','🎻 懸疑音樂'],['C','🥁 活力節奏']],traits=['速度較慢','速度較快','音色柔和','音色明亮','節奏平穩','節奏密集'],feelings=['溫暖','安心','平靜','緊張','活力','期待'];let ready=!!st.song&&st.traits.length>=2&&!!st.feeling;layout('🏰 第三島｜暖心配樂城堡','四人一組討論，每個人用自己的iPad決定，再向同組同學分享理由。',`<div class="quest-card"><h3>🎬 任務一：為「一句關心」選出BGM</h3><div class="tags">${songs.map(([v,t])=>`<button class="tag ${st.song===v?'on':''}" data-song="${v}">${v} ${t}</button>`).join('')}</div><h3>🔎 任務二：蒐集兩個真正聽到的音樂線索</h3><div class="tags">${traits.map(t=>`<button class="tag ${st.traits.includes(t)?'on':''}" data-trait="${t}">${st.traits.includes(t)?'✅':'▫️'} ${t}</button>`).join('')}</div><h3>💗 任務三：想讓觀眾感受到什麼？</h3><div class="tags">${feelings.map(t=>`<button class="tag ${st.feeling===t?'on':''}" data-feel="${t}">${t}</button>`).join('')}</div></div><div class="quest-card"><h3>🗣️ 任務四：向組員說出你的理由</h3><p class="note">句型：「我選 ${st.song||'__'} 版，因為${st.traits.length?st.traits.join('、'):'＿＿'}，想帶給觀眾${st.feeling||'＿＿'}的感受。」</p><label><input type="checkbox" id="agreed" ${st.groupOK?'checked':''}> 我已說出理由，也聽過至少一位組員的想法</label><h3 style="margin-top:15px">🤝 如果組員跟我選的不一樣，我會……</h3><div class="tags"><button class="tag ${st.peer==='ask'?'on':''}" data-peer="ask">先問他聽到了什麼</button><button class="tag ${st.peer==='listen'?'on':''}" data-peer="listen">一起再聽一次並比較</button></div></div>${ready?`<div class="proposal">🌟 我的配樂提案：我們選擇 <b>${st.song}</b> 版BGM，因為音樂<b>${st.traits.join('、')}</b>，讓觀眾感到<b>${st.feeling}</b>，呼應「一句關心」的廣告訴求。</div>`:''}<button id="win" class="btn gold" ${!(ready&&st.groupOK&&st.peer)?'disabled':''}>🏰 完成配樂任務（+65音符）</button>`);$('panel').querySelectorAll('[data-song]').forEach(b=>b.onclick=()=>{st.song=b.dataset.song;save();castle()});$('panel').querySelectorAll('[data-trait]').forEach(b=>b.onclick=()=>{let t=b.dataset.trait;st.traits=st.traits.includes(t)?st.traits.filter(x=>x!==t):[...st.traits,t];save();castle()});$('panel').querySelectorAll('[data-feel]').forEach(b=>b.onclick=()=>{st.feeling=b.dataset.feel;save();castle()});$('panel').querySelectorAll('[data-peer]').forEach(b=>b.onclick=()=>{st.peer=b.dataset.peer;save();castle()});$('agreed').onchange=e=>{st.groupOK=e.target.checked;save();castle()};$('win').onclick=()=>finish(2,65)}
const exits=[{q:'同樣的廣告畫面換成不同BGM，觀眾的情緒可能改變嗎？',c:['可能，配樂會影響感受','不可能，只看畫面就好'],a:0},{q:'如果要比較速度Tempo，怎樣設計才較公平？',c:['同旋律，只改變速度','旋律、音色、速度全部一起改'],a:0},{q:'組員對同一段音樂感受不同，你會怎麼做？',c:['聆聽他的音樂證據，尊重不同感受','認為他的感受一定是錯的'],a:0}];function exitIsland(){let i=st.exit.length;if(i>=3){layout('🏆 第四島｜音樂離場之島','你完成了獨立學習檢核。',`<div class="starburst">🎟️ 🏅 🎶</div><h3 style="text-align:center">授予：延和暖心配樂冒險家</h3><p style="text-align:center">完成個人任務！目前為單機試玩，教師端尚未接收資料。</p><button class="btn gold" id="win">🏆 收下畢業徽章（+25音符）</button>`);$('win').onclick=()=>finish(3,25);return}let q=exits[i];layout('🏆 第四島｜個人音樂離場挑戰',`離場券 ${i+1}／3：請獨立判斷，正式連線後教師可即時查看作答情況。`,`<div class="meter"><div style="width:${i/3*100}%"></div></div><div class="quest-card"><h3>${q.q}</h3>${choices(q.c,-1)}</div><p class="note">這是個人任務，請獨立判斷；試玩答案只會保存在本機。</p>`);bind(v=>{st.exit.push({answer:v,correct:v===q.a});save();layout('🎫 已記錄這題的想法','教師端可查看這一題的作答結果。',`<div class="starburst">✨</div><button class="btn gold" id="go">繼續下一題 ➜</button>`);$('go').onclick=exitIsland})}
function init(){$('nickname').value=localStorage.getItem('yanhe-nickname')||'';$('group').value=localStorage.getItem('yanhe-group')||'1';['nickname','group'].forEach(id=>$(id).addEventListener('change',()=>{localStorage.setItem('yanhe-'+id,$(id).value);save()}));$('restart').onclick=()=>{if(!confirm('確定清除這台裝置的試玩進度？'))return;st={...initial,done:[false,false,false,false],answers:[],traits:[],exit:[],tries:[0,0,0]};save();$('panel').classList.add('hidden');drawMap()};drawMap();save()}init()})();
</script></body></html>
