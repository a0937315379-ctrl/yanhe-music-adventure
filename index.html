<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152547"><title>延和音樂冒險島｜試玩版</title><style>
:root{--ink:#1d3155;--blue:#294c83;--gold:#ffc94d;--cream:#fffaf1;--soft:#edf6ff;--border:#d8e4f0}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;background:linear-gradient(#85d5fc 0%,#d3f4ff 47%,#f5fcf7 47%,#edf6e9 100%);color:var(--ink);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #ff9f33;outline-offset:3px}.shell{max-width:1060px;margin:auto;padding:18px 16px 60px}.top{background:#193156;color:white;border:3px solid #38527b;border-radius:18px;padding:14px 18px;box-shadow:0 8px 0 #10233e;display:flex;align-items:center;justify-content:space-between;gap:10px}.top h1{margin:0;font-size:clamp(19px,4vw,30px)}.top small{color:#c7e1ff}.chip{background:#fbe7ae;color:#60420d;border-radius:20px;padding:9px 13px;font-size:13px;font-weight:800}.notice{margin:16px 0;background:#fffdf6;border:2px solid #e2decf;border-radius:13px;padding:11px 14px;font-size:14px}.profile{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:#fff9;border:1px solid #d4e2ee;padding:12px;border-radius:15px;margin-bottom:18px}.profile label{display:grid;gap:4px;font-size:13px;font-weight:700}.profile input,.profile select{padding:10px;border:2px solid #c0d5e5;border-radius:10px;background:white;min-width:116px}.btn{background:#2e6cb9;color:#fff;border:0;border-radius:12px;padding:11px 17px;font-weight:800;box-shadow:0 4px 0 #234c80}.btn.secondary{background:#edf3fc;color:#264c7a;box-shadow:0 3px 0 #c9d5e4}.btn.gold{background:#ffcb49;color:#3d2b08;box-shadow:0 4px 0 #dca11b}.btn:disabled{opacity:.45;cursor:not-allowed}.map{position:relative;isolation:isolate;padding:28px 20px 36px;min-height:315px;border:4px solid #4d9a69;border-radius:24px;background:repeating-linear-gradient(90deg,#a5e688 0 70px,#b6e995 70px 140px);box-shadow:0 9px 0 #44865e;overflow:hidden}.map:before{content:'☁️　　☁️　　　　　　　　　☁️';position:absolute;z-index:-1;top:4px;left:0;width:100%;text-align:center;font-size:30px;opacity:.8}.map-title{text-align:center;font-size:21px;font-weight:900;color:#21543c;background:#eaffdbbb;border-radius:12px;padding:7px;margin-bottom:18px}.level-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.level{min-height:170px;background:#fffef4;border:4px solid #fff;outline:3px solid #64985c;border-radius:18px;padding:16px 8px;text-align:center;box-shadow:0 7px 0 #508e50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:transform .15s}.level:not(:disabled):active{transform:translateY(4px);box-shadow:0 3px 0 #508e50}.level .emoji{font-size:43px}.level strong{font-size:17px}.level small{font-size:12px;color:#57705c}.level.done{background:#fff4c4}.level.locked{opacity:.65;filter:grayscale(.25)}.flag{font-size:12px;color:#82611d;font-weight:800}.panel{margin-top:22px;background:var(--cream);border:3px solid #d6e5e9;border-radius:22px;padding:24px;box-shadow:0 7px 0 #d7e6d9}.panel h2{margin:0 0 10px;font-size:24px}.panel p{line-height:1.65}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.choice{border:3px solid #d5e4f1;border-radius:15px;background:white;color:#24395d;padding:16px 10px;min-height:69px;font-weight:800;text-align:center}.choice.selected{border-color:#eca72d;background:#fff0ba;box-shadow:inset 0 0 0 2px white}.choice.correct{border-color:#3f9e71;background:#e0f8df}.choice.wrong{border-color:#cc6870;background:#fff0ee}.tip{background:#eaf4ff;border-left:5px solid #4f8bc9;border-radius:10px;padding:12px;margin:12px 0;font-size:14px}.result{padding:13px 16px;background:#fff1cf;border-radius:12px;margin:12px 0;font-weight:700}.question{background:#fff;border:2px solid #dce9f2;border-radius:17px;padding:18px;margin:14px 0}.qnum{color:#3579ad;font-weight:900;font-size:13px}.progress{height:13px;background:#dbe6ed;border-radius:10px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#f5b73e;transition:width .25s}.stamp{font-size:42px}.hidden{display:none!important}.teacher-note{color:#667e95;font-size:13px;margin-top:12px}.options{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.option{border:2px solid #d1e1eb;border-radius:16px;padding:10px 13px;background:white;color:var(--ink);font-weight:700}.option.picked{background:#ffdf8e;border-color:#d9971e}.option:disabled{opacity:.6}.mini{font-size:13px;color:#526884}.summary{border:2px dashed #b7c9de;border-radius:12px;padding:16px;background:white;line-height:1.8}.footer{margin:20px 0;color:#34506b;font-size:13px;text-align:center}@media(max-width:650px){.level-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.level{min-height:145px}.panel{padding:16px}.top{flex-wrap:wrap}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.profile{align-items:stretch}.profile label{flex:1}}
</style></head><body><main class="shell"><header class="top"><div><small>延和國中・八年級音樂</small><h1>🎮 聲音的魔法：音樂冒險島</h1></div><span class="chip" id="score">⭐ 0／4 關</span></header><div class="notice">🧪 <b>V1 單機試玩版</b>：老師統一播放音樂；此頁沒有聲音、不會傳送任何答案到 Firebase。原本的「音樂情緒 LIVE」網站不受影響。</div><div class="profile"><label>我的代號（勿填姓名）<input id="nickname" maxlength="12" placeholder="例：08號"></label><label>小組<select id="group"><option value="1">第1組</option><option value="2">第2組</option><option value="3">第3組</option><option value="4">第4組</option><option value="5">第5組</option><option value="6">第6組</option><option value="7">第7組</option><option value="8">第8組</option></select></label><button class="btn secondary" id="restart">↻ 清除本機試玩紀錄</button></div><section class="map"><div class="map-title">🗺️ 四大音樂冒險世界</div><div class="level-grid" id="mapButtons"></div></section><section class="panel" id="panel" aria-live="polite"></section><div class="footer">原創音符冒險主題・支援 iPad Safari｜闖關動畫及題目為示範設計，可隨正式教案調整</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),defs={level:0,done:[false,false,false,false],emotion:'',answers:[],song:'',traits:[],feeling:'',groupOK:false,exit:[],tries:[0,0,0]};let st={...defs};try{st={...defs,...JSON.parse(localStorage.getItem('yanhe-adventure-v1')||'{}')}}catch(e){}const save=()=>localStorage.setItem('yanhe-adventure-v1',JSON.stringify(st));const labels=['💗 情緒森林','🎼 節奏山谷','🏰 配樂城堡','🏆 離場挑戰'],descs=['從情緒出發','BGM與Tempo密碼','小組配樂任務','個人學習驗收'];const qBank=[{q:'廣告中用來襯托畫面氣氛的背景音樂稱為？',choices:['BGM','音量','旁白'],a:0,hint:'BGM 是 Background Music 的縮寫。'},{q:'Tempo 指音樂的哪個特徵？',choices:['速度','音色','歌詞'],a:0,hint:'想想 70、100、130 BPM，比較的是快慢。'},{q:'老師播放相同旋律的70與130 BPM，哪個版本速度較快？',choices:['70 BPM','130 BPM','一樣快'],a:1,hint:'BPM 數字越高，通常代表每分鐘拍數越多。'}],exitBank=[{q:'影片不變，只更換BGM，觀眾的情緒感受可能改變嗎？',c:['可能，音樂會影響感受','不可能，影片一樣就都一樣'],a:0},{q:'要公平比較Tempo的影響，最適合如何設計音樂？',c:['同旋律、同音色，僅改變速度','同時更換旋律、音色與速度'],a:0},{q:'同學感覺和我不同，我可以怎麼做？',c:['詢問對方聽到的音樂線索，尊重差異','認為對方一定聽錯了'],a:0}];function markDone(i){st.done[i]=true;save();drawMap()}function drawMap(){$('score').textContent='⭐ '+st.done.filter(Boolean).length+'／4 關';$('mapButtons').innerHTML='';labels.forEach((x,i)=>{let b=document.createElement('button');b.className='level '+(st.done[i]?'done ':'')+(i>0&&!st.done[i-1]?'locked':'');b.disabled=i>0&&!st.done[i-1];b.innerHTML='<span class="emoji">'+x.split(' ')[0]+'</span><strong>第'+(i+1)+'關</strong><strong>'+x.substring(3)+'</strong><small>'+descs[i]+'</small><span class="flag">'+(st.done[i]?'✅ 已完成':b.disabled?'🔒 待解鎖':'▶ 開始闖關')+'</span>';b.onclick=()=>show(i);$('mapButtons').append(b)})}function show(i){st.level=i;save();drawMap();if(i===0)level1();if(i===1)level2();if(i===2)level3();if(i===3)level4();$('panel').scrollIntoView({behavior:'smooth',block:'start'})}function buttons(items,picked,handler){return '<div class="choices">'+items.map((s,i)=>'<button class="choice '+(picked===i?'selected':'')+'" data-x="'+i+'">'+s+'</button>').join('')+'</div>'}function bindChoices(fn){$('panel').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>fn(Number(b.dataset.x)))}function next(i){return '<div class="row"><button class="btn gold" id="next">⭐ 完成這關，前往下一關 →</button></div>'}function level1(){let items=['🥰 溫暖','😰 緊張','😌 平靜','🤩 活力'];$('panel').innerHTML='<h2>💗 第一關｜情緒森林</h2><p>聽老師播放的廣告配樂，想想這段音樂帶給你什麼感受。請選擇<strong>最接近的一項</strong>；沒有唯一正確答案。</p><div class="tip">📣 正式課堂將沿用你原本已完成的「音樂情緒 LIVE」QR 即時投票。這裡先體驗闖關流程。</div>'+buttons(items,items.findIndex(x=>x.includes(st.emotion)),v=>v)+'<div id="action"></div>';bindChoices(v=>{st.emotion=['溫暖','緊張','平靜','活力'][v];save();level1()});if(st.emotion){$('action').innerHTML='<div class="result">你選擇了「'+st.emotion+'」；不同感受都值得尊重。</div>'+next(0);$('next').onclick=()=>{markDone(0);show(1)}}}function level2(){let i=Math.min(st.answers.length,qBank.length-1),finished=st.answers.length===qBank.length,q=qBank[i];$('panel').innerHTML='<h2>🎼 第二關｜節奏山谷</h2><p>收集三枚音符金幣，破解 BGM 與 Tempo 的密碼。答錯可以看提示後重試。</p><div class="progress"><div style="width:'+(st.answers.length/3*100)+'%"></div></div><p class="mini">🎵 已收集 '+st.answers.length+'／3 枚音符</p>'+(finished?'<div class="result">✨ 三題都答對了！你已解開音樂密碼。</div>'+next(1):'<div class="question"><div class="qnum">第 '+(i+1)+' 題</div><h3>'+q.q+'</h3>'+buttons(q.choices,-1)+'</div><div id="feedback"></div>');if(finished){$('next').onclick=()=>{markDone(1);show(2)};return}bindChoices(v=>{if(v===q.a){st.answers.push(v);save();level2()}else{$('feedback').innerHTML='<div class="tip">💡 再試一次：'+q.hint+'</div>';st.tries[i]++;save()}})}function level3(){let songOptions=['🎹 A 溫暖鋼琴','🎻 B 緊張懸疑','🥁 C 輕快活力'],traitOptions=['速度較慢','速度較快','音色柔和','音色明亮','節奏平穩','節奏密集'],feelings=['溫暖','安心','平靜','緊張','活力','期待'];$('panel').innerHTML='<h2>🏰 第三關｜配樂城堡</h2><p>全組先討論，再由每位組員在自己的iPad上完成相同提案。正式版將加入組內共識與教師成果牆。</p><div class="tip">🎬 老師播放A、B、C三種版本後，再作選擇；不需要學生平板播放音樂。</div><h3>① 我們選擇哪一首BGM？</h3><div class="options" id="songBox"></div><h3>② 找出至少兩個有根據的音樂特徵</h3><div class="options" id="traitsBox"></div><h3>③ 想傳達什麼情緒？</h3><div class="options" id="feelingBox"></div><div id="proposal"></div>';function draw(){let box=$('songBox');box.innerHTML=songOptions.map((v,i)=>'<button class="option '+(st.song===String.fromCharCode(65+i)?'picked':'')+'" data-s="'+String.fromCharCode(65+i)+'">'+v+'</button>').join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{st.song=b.dataset.s;save();draw()});box=$('traitsBox');box.innerHTML=traitOptions.map(x=>'<button class="option '+(st.traits.includes(x)?'picked':'')+'" data-t="'+x+'">'+(st.traits.includes(x)?'✅ ':'□ ')+x+'</button>').join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(st.traits.includes(b.dataset.t))st.traits=st.traits.filter(x=>x!==b.dataset.t);else st.traits.push(b.dataset.t);save();draw()});box=$('feelingBox');box.innerHTML=feelings.map(x=>'<button class="option '+(st.feeling===x?'picked':'')+'" data-f="'+x+'">'+x+'</button>').join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{st.feeling=b.dataset.f;save();draw()});let ready=!!st.song&&st.traits.length>=2&&!!st.feeling;$('proposal').innerHTML=ready?'<div class="summary"><b>✨ 小組配樂提案：</b><p>我們選擇 <b>'+st.song+'</b> 版BGM，因為它的<b>'+st.traits.join('、')+'</b>，讓觀眾感受到<b>'+st.feeling+'</b>，呼應校園暖心廣告的主題。</p></div><label class="row" style="padding:12px 0"><input type="checkbox" id="agreed" '+(st.groupOK?'checked':'')+'> 我已和組員討論並確認這是小組共識</label><button class="btn gold" id="finish3" '+(!st.groupOK?'disabled':'')+'>⭐ 完成小組任務 →</button>':'<div class="tip">再完成選擇：一首BGM、至少兩個音樂特徵，以及一種情緒。</div>';if(ready){$('agreed').onchange=e=>{st.groupOK=e.target.checked;save();draw()};$('finish3').onclick=()=>{markDone(2);show(3)}}}draw()}function level4(){let i=st.exit.length;let q=exitBank[i];$('panel').innerHTML='<h2>🏆 第四關｜個人音樂離場挑戰</h2><p>這三題由每位同學獨立回答，不需要小組討論。完成後獲得音樂冒險家徽章。</p><div class="progress"><div style="width:'+(i/3*100)+'%"></div></div><p class="mini">🎟️ 已完成 '+i+'／3 題</p>'+(i>=3?'<div style="text-align:center"><div class="stamp">🏅</div><h2>闖關成功！</h2><p>你已完成音樂知識與尊重差異的學習離場券。</p></div><div class="row"><button class="btn gold" id="award">領取冒險家徽章</button></div>':'<div class="question"><div class="qnum">離場挑戰 '+(i+1)+'／3</div><h3>'+q.q+'</h3>'+buttons(q.c,-1)+'</div><div id="feedback"></div>');if(i>=3){$('award').onclick=()=>{markDone(3);$('panel').innerHTML='<div style="text-align:center"><div class="stamp">🏆🎶⭐</div><h2>音樂冒險全破關！</h2><p>你的四個關卡已全部完成。請等待老師統整課程。</p><button class="btn secondary" id="backMap">回到冒險地圖</button></div>';$('backMap').onclick=()=>window.scrollTo({top:0,behavior:'smooth'})};return}bindChoices(v=>{st.exit.push({answer:v,correct:v===q.a});save();level4()})}function start(){$('group').value='1';$('restart').onclick=()=>{if(!confirm('要清除這台裝置的試玩進度嗎？'))return;localStorage.removeItem('yanhe-adventure-v1');st={...defs};drawMap();show(0)};drawMap();show(Math.min(st.level,st.done.findIndex(x=>!x)===-1?3:st.done.findIndex(x=>!x)))}start()})();
</script></body></html>
